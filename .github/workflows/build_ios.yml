name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 iOS 原生脚手架
        run: flutter create . --platforms=ios

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS Release 架构
        run: flutter build ios --release --no-codesign

      - name: 打包封装为标准 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr DailyGo.ipa Payload
          cd ../../..

      - name: 上传 iOS IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: daily-go-ios-ipa
          path: build/ios/iphoneos/DailyGo.ipa
