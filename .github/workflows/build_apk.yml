name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 Android 原生脚手架
        run: flutter create . --platforms=android

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Android 安装包 (APK)
        run: |
          flutter build apk --debug --verbose > build.log 2>&1 || {
            echo "========== GRADLE BUILD FAILURE DETAILS =========="
            grep -E "FAILURE|ERROR|Exception|error:|fatal:" build.log -B 2 -A 5 | head -n 100
            echo "========== LAST 80 LINES OF BUILD LOG =========="
            tail -n 80 build.log
            exit 1
          }
          flutter build apk --release --no-tree-shake-icons || true

      - name: 上传构建产物 (APK 与构建日志)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-go-apk
          path: |
            build/**/*.apk
            build.log

