name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 Android 原生脚手架
        run: flutter create . --platforms=android

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Android 安装包 (APK)
        run: |
          # 执行编译构建
          flutter build apk --debug || true
          
          # 检索并归集所有生成的 APK 文件至 dist 目录
          mkdir -p dist
          find . -name "*.apk" -exec cp -v {} dist/ \;
          
          echo "=== 已成功打包的 APK 文件清单 ==="
          ls -lh dist/
          
          # 严格校验：确保至少存在一个有效安装包
          if [ -z "$(ls -A dist/*.apk 2>/dev/null)" ]; then
            echo "::error::未检测到任何编译生成的 APK 文件"
            exit 1
          fi

      - name: 上传构建产物 (APK 安装包)
        uses: actions/upload-artifact@v4
        with:
          name: daily-go-apk
          path: dist/*.apk


