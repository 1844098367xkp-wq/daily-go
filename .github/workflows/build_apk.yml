name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 Android 原生脚手架
        run: flutter create . --platforms=android

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Android 安装包 (APK)
        run: |
          # 1. 构建保证可直接安装在手机上的标准 APK (Debug 签名包，零门槛安装)
          flutter build apk --debug
          # 2. 尝试构建 Release 版 (如已生成 release 包则一并打包)
          flutter build apk --release --no-tree-shake-icons || true

      - name: 上传 APK 构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-go-apk
          path: build/**/*.apk
