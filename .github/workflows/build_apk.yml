name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 Android 原生脚手架与 Gradle 兼容配置
        run: |
          flutter create . --platforms=android
          # 统一配置 compileSdk 为 34, minSdk 为 21
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          # 针对 AGP 8+ 统一对齐 compileSdkVersion 34 并补齐第三方库 namespace
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace = project.group ?: "com.example.${project.name.replaceAll('-', '_')}"
                          }
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF


      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Android 安装包 (APK)
        run: |
          flutter build apk --debug --verbose > build.log 2>&1 || {
            echo "========== GRADLE BUILD FAILURE DETAILS =========="
            tail -n 80 build.log
            exit 1
          }
          flutter build apk --release --no-tree-shake-icons || true

      - name: 提取错误并生成 GitHub 批注
        if: failure()
        run: |
          python3 -c "
          import re
          try:
              with open('build.log') as f:
                  lines = f.readlines()
              errs = [l.strip() for l in lines if re.search(r'FAILURE|Exception|compileDebug|error:|Execution failed', l)]
              for e in errs[-10:]:
                  print(f'::error::{e}')
          except Exception as ex:
              print(f'::error::{ex}')
          "

      - name: 上传构建产物 (APK 与构建日志)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-go-apk
          path: |
            build/**/*.apk
            build.log

