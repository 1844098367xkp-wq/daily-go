name: daily_go
description: "每日行 (DailyGo) - 极简、零认知负荷、秒开即用的个人日程规划 App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  uuid: ^4.2.1
  audioplayers: ^6.1.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  sqflite_android: 2.4.1
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
